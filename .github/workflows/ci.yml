name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.11 / Linux
            runner: ubuntu-24.04
            python: "3.11"
          - name: Python 3.13 / Linux
            runner: ubuntu-24.04
            python: "3.13"
          - name: Python 3.13 / macOS ARM
            runner: macos-15
            python: "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test with coverage gate
        run: python -m pytest -q --cov=groundray --cov-report=term-missing
      - name: Check installer syntax
        run: |
          sh -n install
          sh -n install-groundray

  package:
    name: Build and inspect Python package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install "build>=1.2,<2" "twine>=7,<8"
          python -m build
          python -m twine check dist/*
      - name: Verify bundled runtime data
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "groundray/schemas/brain.schema.yaml",
              "groundray/schemas/bundle-config.schema.yaml",
              "groundray/schemas/knowledge-item.schema.yaml",
              "groundray/skills/groundray-storage/SKILL.md",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing bundled data: {missing}")
          PY
      - name: Smoke-test installed wheel
        run: |
          python -m venv "${RUNNER_TEMP}/package-smoke"
          "${RUNNER_TEMP}/package-smoke/bin/pip" install dist/*.whl
          "${RUNNER_TEMP}/package-smoke/bin/groundray" --version
          "${RUNNER_TEMP}/package-smoke/bin/groundray" --help >/dev/null

  search-prototypes:
    name: SQLite / Tantivy / QMD search prototypes
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install benchmark dependencies
        env:
          # Avoid component collisions with the hosted runner's preinstalled Rust.
          RUSTUP_HOME: ${{ runner.temp }}/groundray-prototype-rustup
        run: |
          python -m pip install -e ".[dev]"
          npm install --global @tobilu/qmd@2.8.3
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
      - name: Check and build the Rust prototype
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --release --locked
      - name: Test normalized sections, both engines, and native recovery
        env:
          GROUNDRAY_TANTIVY_COMMAND: ${{ github.workspace }}/target/release/groundray-search
          GROUNDRAY_BENCHMARK_REFERENCE_EXPORT: ${{ runner.temp }}/groundray-reference-corpus
        run: python -m pytest -q tests/test_search_records.py tests/test_search_benchmarks.py tests/test_search_recovery.py tests/test_tantivy_provider.py
      - name: Compare shared reference and scale corpora
        run: |
          python -m benchmarks.search run "${RUNNER_TEMP}/groundray-reference-corpus" --output "${RUNNER_TEMP}/groundray-prototype-results/reference" --tantivy target/release/groundray-search --qmd qmd
          python -m benchmarks.search generate --items 1000 --output "${RUNNER_TEMP}/groundray-scale-corpus"
          python -m benchmarks.search run "${RUNNER_TEMP}/groundray-scale-corpus" --output "${RUNNER_TEMP}/groundray-prototype-results/1000" --tantivy target/release/groundray-search --qmd qmd
      - name: Retain provider comparison reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search-prototype-comparison
          path: ${{ runner.temp }}/groundray-prototype-results/**/report.json
          if-no-files-found: error

  qmd-compatibility:
    name: QMD 2.8.3 compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Groundray and pinned QMD
        run: |
          python -m pip install -e ".[dev]"
          npm install --global @tobilu/qmd@2.8.3
          qmd --version
      - name: Exercise real keyword indexing and retrieval
        env:
          GROUNDRAY_REAL_QMD: "1"
          GROUNDRAY_QMD_EVALUATION_REPORT: ${{ runner.temp }}/qmd-evaluation.json
        run: python -m pytest -q tests/test_qmd_integration.py
      - name: Retain labeled QMD baseline report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qmd-evaluation
          path: ${{ runner.temp }}/qmd-evaluation.json
          if-no-files-found: error

  groundray-plugin:
    name: Groundray native plugin (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: darwin-x86_64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Build and install current wheel and native engine
        env:
          RUSTUP_HOME: ${{ runner.temp }}/groundray-rustup
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          cargo build --release --locked
          python -m pip install "build>=1.2,<2" "pyinstaller>=6.19,<7"
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Freeze and package Groundray
        run: |
          python scripts/freeze_groundray_cli.py --native target/release/groundray-search --output "${RUNNER_TEMP}/groundray-freeze"
          python scripts/build_groundray_plugin.py --cli "${RUNNER_TEMP}/groundray-freeze/dist/groundray" --output "${RUNNER_TEMP}/groundray-marketplace"
      - name: Exercise installed native CLI through packaged helper
        run: python scripts/smoke_groundray_plugin.py --package "${RUNNER_TEMP}/groundray-marketplace" --output "${RUNNER_TEMP}/groundray-smoke"
      - name: Set up Node.js for plugin host tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the pinned Codex host
        run: npm install --prefix "${RUNNER_TEMP}/groundray-codex" @openai/codex@0.161.0
      - name: Install the pinned Claude Code host
        run: npm install --prefix "${RUNNER_TEMP}/groundray-claude" @anthropic-ai/claude-code@2.1.303
      - name: Verify persistent installation with the actual Codex host
        run: python scripts/smoke_groundray_install.py --package "${RUNNER_TEMP}/groundray-marketplace" --codex "${RUNNER_TEMP}/groundray-codex/node_modules/.bin/codex" --output "${RUNNER_TEMP}/groundray-install-smoke"
      - name: Verify installation and skill discovery with the actual Claude Code host
        run: python scripts/smoke_groundray_claude.py --package "${RUNNER_TEMP}/groundray-marketplace" --claude "${RUNNER_TEMP}/groundray-claude/node_modules/.bin/claude" --output "${RUNNER_TEMP}/groundray-claude-smoke"
      - name: Retain development package and smoke traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: groundray-plugin-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/groundray-marketplace/*.zip
            ${{ runner.temp }}/groundray-marketplace/*.tar.gz
            ${{ runner.temp }}/groundray-marketplace/SHA256SUMS
            ${{ runner.temp }}/groundray-smoke/operations.jsonl
            ${{ runner.temp }}/groundray-smoke/result.json
            ${{ runner.temp }}/groundray-install-smoke/result.json
            ${{ runner.temp }}/groundray-claude-smoke/result.json
            ${{ runner.temp }}/groundray-claude-smoke/operations.json
          if-no-files-found: warn
